# ─────────────────────────────────────────────────────────────
# Cowrie Configuration — Medical IoT Device Persona
# Device: BD Alaris 8015 Infusion Pump (Embedded Linux)
# ─────────────────────────────────────────────────────────────

[honeypot]

# Hostname shown to attackers — matches medical device naming
hostname = infusion-pump-01

# Cowrie data directory
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads

# Timezone
timezone = UTC

# Fake OS type shown in banner
fake_addr = 172.20.0.10

# Number of seconds before a login session times out
interactive_timeout = 180
authentication_timeout = 120

# Max login attempts before disconnect
auth_class = UserDB
auth_class_parameters = etc/userdb.txt

# Delay failed login slightly to slow brute force (seconds)
failDelay = 1

# How many failed login attempts before disconnect
maxtries = 5

# Reconnect throttle (seconds to wait before same IP can reconnect)
max_auth_attempts = 5


# ─── SSH Settings ─────────────────────────────────────────────
[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

# SSH version string — matches typical embedded Linux device
version = SSH-2.0-OpenSSH_6.0p1 Raspbian-6+deb7u3

# RSA key for host identification
rsa_public_key = etc/ssh_host_rsa_key.pub
rsa_private_key = etc/ssh_host_rsa_key

# DSA key
dsa_public_key = etc/ssh_host_dsa_key.pub
dsa_private_key = etc/ssh_host_dsa_key

# ECDSA key
ecdsa_public_key = etc/ssh_host_ecdsa_key.pub
ecdsa_private_key = etc/ssh_host_ecdsa_key


# ─── Telnet Settings ──────────────────────────────────────────
[telnet]
enabled = true
listen_endpoints = tcp:2323:interface=0.0.0.0


# ─── Logging ──────────────────────────────────────────────────
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log

# Log ALL commands, even failed sessions
[output_mysql]
enabled = false

# Log downloads for malware analysis
[output_s3]
enabled = false


# ─── Shell Interaction Settings ───────────────────────────────
[shell]

# Simulated filesystem (generated to look like embedded Linux)
filesystem = share/cowrie/fs.pickle

# Show these processes when attacker runs 'ps'
processes = sshd: [priv]|||sshd: root|||/usr/sbin/sshd -D|||/sbin/init|||/usr/sbin/thttpd|||alaris_pump_daemon|||watchdog/0|||kworker/0:0

# Kernel version shown in uname
kernel_version = 3.10.17

kernel_build_string = #1 PREEMPT Wed Oct 2 12:15:22 UTC 2013

hardware_platform = armv6l

operating_system = GNU/Linux
